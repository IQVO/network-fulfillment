asyncapi: 2.6.0

info:
  title: Network Fulfillment Events
  version: "2.0.0"
  description: |
    Domain-event catalog for **Network Fulfillment**, a Supporting bounded
    context in the WES (Warehouse Execution Systems) subdomain: the
    anti-corruption layer between the warehouse-systems fleet and an
    external retail fulfillment network. One aggregate raises every event
    documented here:

    - `NetworkOrder` (package `internal/domain/networkorder`) — one network
      purchase order and its acknowledgement lifecycle. Raises
      `NetworkOrderReceived`, `NetworkOrderSubmitted`,
      `NetworkOrderAcknowledged` (v2: raised when the order settles
      `ACKNOWLEDGED`, ADR 0016), `NetworkOrderRejected`,
      `NetworkOrderShipmentConfirmed` and (from the
      acknowledgement sweep, without a state transition)
      `AcknowledgementDeadlineAtRisk`; and (from the orphaned-hold sweep,
      ADR 0024, also without a state transition) `OrphanedHoldCancelled`.

    **Envelope (mandatory, ADR 0008).** Every message on every channel of
    this service is a CloudEvents 1.0 event in *structured content mode*
    (Kafka protocol binding): the Kafka message value is the JSON event
    format, content type `application/cloudevents+json`, and every message
    carries the Kafka header
    `content-type: application/cloudevents+json; charset=UTF-8`. There is no
    other envelope. All of `specversion`, `id`, `source`, `type`, `subject`,
    `time`, `datacontenttype` and `dataschema` are REQUIRED. W3C trace
    context, when present, travels in Kafka headers, never as extension
    attributes: an event written through the transactional outbox inside a
    span carries that span's `traceparent` (and `tracestate` / `baggage`
    when present), stored with the outbox row and sent by the relay
    (ADR 0022). Consumers may extract these headers and must not require
    them. The Kafka message key is the network order reference
    (`networkRef`, identical to `subject`), so every event for one order
    lands on the same partition.

    **Type naming.** `type` is
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`. For
    this context the subdomain is `wes`, the bounded context is
    `network-fulfillment` and the entity is `networkorder`, e.g.
    `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived`.
    The SAME `type` is used for the occurrence on the integration and on
    the analytics channel; `dataschema`
    (`urn:warehouse:network-fulfillment:<events|analytics>:<EventName>:v<N>`)
    names the payload shape. A breaking change gets a new `.v2`
    type and a new dataschema version, never a mutation of these:
    `NetworkOrderAcknowledged` changed meaning in ADR 0016 and is published
    as `...networkorder.NetworkOrderAcknowledged.v2` /
    `...:NetworkOrderAcknowledged:v2`.

    **Consumers** must dispatch on the full `type`, ignore unknown types,
    dedupe on `id` (stable across outbox redelivery), and dead-letter or
    skip — never parse as a legacy shape — anything that fails CloudEvents
    validation.
  contact:
    name: Network Fulfillment — IQVO
    url: https://github.com/IQVO/network-fulfillment
    email: claudioed.oliveira@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

tags:
  - name: network-fulfillment
    description: |
      The Network Fulfillment bounded context (WES subdomain) — the ACL
      between the fleet and the external retail fulfillment network.
  - name: networkorder
    description: Events raised by the `NetworkOrder` aggregate.
  - name: analytics
    description: |
      The internal analytics stream consumed by this service's own
      acknowledgement-report projector.

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Shared warehouse-systems Kafka cluster.

defaultContentType: application/cloudevents+json

channels:
  warehouse.network-fulfillment.events:
    description: |
      The integration topic (the `Topic` constant in
      `internal/adapters/outbound/kafka/publisher.go`). Every domain event
      the `NetworkOrder` aggregate raises is published here, via the
      transactional outbox when `DATABASE_URL` is configured (ADR 0003).
      dataschema: `urn:warehouse:network-fulfillment:events:<EventName>:v<N>`
      (v1, except `NetworkOrderAcknowledged` which is v2 — ADR 0016).
    subscribe:
      operationId: consumeNetworkFulfillmentEvents
      summary: Consume Network Fulfillment integration events.
      description: |
        Every message is a CloudEvents 1.0 structured-mode event; route on
        the full `type` attribute.
      tags:
        - name: network-fulfillment
      message:
        oneOf:
          - $ref: "#/components/messages/NetworkOrderReceived"
          - $ref: "#/components/messages/NetworkOrderSubmitted"
          - $ref: "#/components/messages/NetworkOrderAcknowledged"
          - $ref: "#/components/messages/NetworkOrderRejected"
          - $ref: "#/components/messages/NetworkOrderShipmentConfirmed"
          - $ref: "#/components/messages/AcknowledgementDeadlineAtRisk"
          - $ref: "#/components/messages/OrphanedHoldCancelled"

  warehouse.network-fulfillment.analytics:
    description: |
      The internal analytics topic (the `AnalyticsTopic` constant in
      `internal/adapters/outbound/kafka/analytics_publisher.go`). Carries the
      same seven occurrences with the same `type` and payload, but a distinct
      `id` per occurrence and dataschema
      `urn:warehouse:network-fulfillment:analytics:<EventName>:v<N>` (v1,
      except `NetworkOrderAcknowledged` which is v2). There is
      no `schema_version` field. Consumed by this service's own analytics
      projector (`internal/adapters/inbound/kafka/analytics_consumer.go`),
      which handles `NetworkOrderReceived`, `NetworkOrderSubmitted` (claimed,
      no report effect), `NetworkOrderAcknowledged` v2, the HISTORIC
      `NetworkOrderAcknowledged` v1 still on the topic (unsuffixed type,
      published before ADR 0016, counted as before so a replay keeps the
      report numbers) and `NetworkOrderRejected`, ignores other types
      (`NetworkOrderShipmentConfirmed`, `AcknowledgementDeadlineAtRisk` and
      `OrphanedHoldCancelled` today), and dead-letters to
      `warehouse.network-fulfillment.analytics.dlq` anything that is not a
      valid CloudEvent.
    subscribe:
      operationId: consumeNetworkFulfillmentAnalytics
      summary: Consume Network Fulfillment analytics events.
      description: |
        Every message is a CloudEvents 1.0 structured-mode event; route on
        the full `type` attribute.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/NetworkOrderReceivedAnalytics"
          - $ref: "#/components/messages/NetworkOrderSubmittedAnalytics"
          - $ref: "#/components/messages/NetworkOrderAcknowledgedAnalytics"
          - $ref: "#/components/messages/NetworkOrderRejectedAnalytics"
          - $ref: "#/components/messages/NetworkOrderShipmentConfirmedAnalytics"
          - $ref: "#/components/messages/AcknowledgementDeadlineAtRiskAnalytics"
          - $ref: "#/components/messages/OrphanedHoldCancelledAnalytics"

  warehouse.process-path-management.events:
    description: |
      process-path-management's integration topic, CONSUMED by this service,
      not published (the `Topic` constant in
      `internal/adapters/outbound/processpathcache/consumer.go`). The
      process-path capability cache replays it from the earliest offset under
      a per-process unique group
      (`network-fulfillment-process-path-capability-cache`), started only when
      `CAPABILITY_OFFER_ENABLED=true`. It acts on `ProcessPathCreated`,
      `ProcessPathUpdated`, `ProcessPathDeactivated` and `CPTScheduleChanged`
      and ignores every other type.
    subscribe:
      operationId: consumeProcessPathEvents
      summary: Keep the local process-path and CPT-schedule capability cache current.
      message:
        oneOf:
          - $ref: "#/components/messages/ProcessPathCreated"
          - $ref: "#/components/messages/ProcessPathUpdated"
          - $ref: "#/components/messages/ProcessPathDeactivated"
          - $ref: "#/components/messages/CPTScheduleChanged"
  warehouse.work-planning.events:
    description: |
      wes-work-planning's integration topic, CONSUMED by this service, not
      published (the `Topic` constant in
      `internal/adapters/outbound/pathcapacitycache/consumer.go`). The path
      capacity cache replays it under a per-process unique group, started only
      when `CAPABILITY_OFFER_ENABLED=true`, and acts only on
      `PathCapacityChanged`.
    subscribe:
      operationId: consumeWorkPlanningEvents
      summary: Keep the local remaining-admission-capacity read model current.
      message:
        $ref: "#/components/messages/PathCapacityChanged"
  warehouse.inbound-receiving.events:
    description: |
      inbound-receiving's integration topic, CONSUMED by this service, not
      published (the inbound loop of ADR 0028: `TypeReceiptCartonReceived`,
      `TypeCartonDiscrepancyRaised`, `TypeReceiptClosed` in
      `internal/adapters/inbound/kafka/receipt_consumer.go`). The consumer
      books the vendor's seller-shipment cartons onto inbound-receiving's ASNs
      and reports the receipts back to the network, under the stable group
      `INBOUND_RECEIPT_CONSUMER_GROUP` (set in warehouse-infra develop as
      `network-fulfillment-inbound-receiving`).
    subscribe:
      operationId: consumeInboundReceiptEvents
      summary: Apply the receipt handover of the inbound loop (ADR 0028).
      message:
        oneOf:
          - $ref: "#/components/messages/ReceiptCartonReceived"
          - $ref: "#/components/messages/CartonDiscrepancyRaised"
          - $ref: "#/components/messages/ReceiptClosed"

components:
  messages:
    NetworkOrderReceived:
      x-no-consumer-reason: "facts of the external-network channel, no consumer by decision (K19)"
      name: NetworkOrderReceived
      title: Network order received
      summary: "Demand from the external retail network was turned into a NetworkOrder; the 24h acknowledgement clock is running."
      description: |
        Raised by the `NetworkOrder` aggregate the moment network demand is received — whether or not every line could be translated into our SKU vocabulary. `lineCount` is the number of successfully translated lines (0 for demand rejected as untranslatable).

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived` — `dataschema`: `urn:warehouse:network-fulfillment:events:NetworkOrderReceived:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/NetworkOrderReceivedEvent"
      examples:
        - name: networkOrderReceived
          summary: "Network order received for network order po-1."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived"
            subject: "po-1"
            time: "2026-09-23T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:NetworkOrderReceived:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              requiredShipBy: "2026-09-25T08:00:00Z"
              acknowledgeBy: "2026-09-24T08:00:00Z"
              lineCount: 2
              at: "2026-09-23T08:00:00Z"

    NetworkOrderSubmitted:
      x-no-consumer-reason: "facts of the external-network channel, no consumer by decision (K19)"
      name: NetworkOrderSubmitted
      title: Network order submitted
      summary: "We told the network yes (the order is SUBMITTED) and a held order exists in order-management; the submission is not yet reconciled."
      description: |
        Raised by the `NetworkOrder` aggregate in the same atomic scope that moves the order to `SUBMITTED` (ADR 0016): the decision to accept in full has been taken, the network has been told yes and a held order exists in order-management (`localOrderId`), but the submission is only accepted-for-processing and NOT yet reconciled against the network's transaction-status record (ADR 0001 §5). It is exactly what `NetworkOrderAcknowledged` v1 used to announce. A consumer must not treat it as a settled commitment: the settle is `NetworkOrderAcknowledged` (v2); a refused submission is `NetworkOrderRejected` with `reason=SUBMISSION_FAILED`.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderSubmitted` — `dataschema`: `urn:warehouse:network-fulfillment:events:NetworkOrderSubmitted:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/NetworkOrderSubmittedEvent"
      examples:
        - name: networkOrderSubmitted
          summary: "Network order submitted for network order po-1."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e34"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderSubmitted"
            subject: "po-1"
            time: "2026-09-23T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:NetworkOrderSubmitted:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              localOrderId: "ord-1"
              receivedAt: "2026-09-23T07:59:00Z"
              at: "2026-09-23T08:00:00Z"

    NetworkOrderAcknowledged:
      name: NetworkOrderAcknowledged
      title: Network order acknowledged (v2)
      summary: "The order settled ACKNOWLEDGED: the network's transaction status confirmed the submission."
      description: |
        Raised by the `NetworkOrder` aggregate when `ReconcileSubmittedOrders` settles the order `SUBMITTED -> ACKNOWLEDGED` (ADR 0016), in the same atomic scope as the state save and before the held order is released. It is a settled commitment. `receivedAt` is carried so consumers can compute acknowledgement latency (`at - receivedAt`) without a second lookup — the analytics projection does exactly that. A pending submission raises nothing; a failed one raises `NetworkOrderRejected` with `reason=SUBMISSION_FAILED` and never this event.

        **Versioning (breaking change).** Until ADR 0016 this event was published when the order moved to `SUBMITTED`. Because its meaning changed, it is published as a NEW `.v2` type and `:v2` dataschema (fleet CloudEvents standard §4); the v1 type `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderAcknowledged` is no longer published. The payload field set is unchanged. The earlier fact is now `NetworkOrderSubmitted`.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderAcknowledged.v2` — `dataschema`: `urn:warehouse:network-fulfillment:events:NetworkOrderAcknowledged:v2`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/NetworkOrderAcknowledgedEvent"
      examples:
        - name: networkOrderAcknowledged
          summary: "Network order acknowledged for network order po-1."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderAcknowledged.v2"
            subject: "po-1"
            time: "2026-09-23T08:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:NetworkOrderAcknowledged:v2"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              localOrderId: "ord-1"
              receivedAt: "2026-09-23T07:59:00Z"
              at: "2026-09-23T08:05:00Z"

    NetworkOrderRejected:
      x-no-consumer-reason: "facts of the external-network channel, no consumer by decision (K19)"
      name: NetworkOrderRejected
      title: Network order rejected
      summary: "We told the network no \u2014 or the acknowledgement window closed unanswered."
      description: |
        Raised by the `NetworkOrder` aggregate whenever the order is refused. `reason` distinguishes a catalogue gap, a capacity signal and an operational failure.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderRejected` — `dataschema`: `urn:warehouse:network-fulfillment:events:NetworkOrderRejected:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/NetworkOrderRejectedEvent"
      examples:
        - name: networkOrderRejected
          summary: "Network order rejected for network order po-1."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderRejected"
            subject: "po-1"
            time: "2026-09-23T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:NetworkOrderRejected:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              reason: "UNTRANSLATABLE_SKU"
              at: "2026-09-23T08:00:00Z"

    NetworkOrderShipmentConfirmed:
      x-no-consumer-reason: "facts of the external-network channel, no consumer by decision (K19)"
      name: NetworkOrderShipmentConfirmed
      title: Network order shipment confirmed
      summary: "A shipment was confirmed back to the network, closing the order."
      description: |
        Raised by the `NetworkOrder` aggregate when its shipment is confirmed to the network, by `ConfirmNetworkOrderShipment` (`POST /network-orders/{networkRef}/shipment-confirmation`, ADR 0014). The use case saves the order as `CONFIRMED` and publishes this event in one atomic scope, then submits the confirmation to the network.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderShipmentConfirmed` — `dataschema`: `urn:warehouse:network-fulfillment:events:NetworkOrderShipmentConfirmed:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/NetworkOrderShipmentConfirmedEvent"
      examples:
        - name: networkOrderShipmentConfirmed
          summary: "Network order shipment confirmed for network order po-1."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderShipmentConfirmed"
            subject: "po-1"
            time: "2026-09-23T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:NetworkOrderShipmentConfirmed:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              localOrderId: "ord-1"
              at: "2026-09-23T08:00:00Z"

    AcknowledgementDeadlineAtRisk:
      name: AcknowledgementDeadlineAtRisk
      title: Acknowledgement deadline at risk
      summary: "An order's 24h acknowledgement window has closed with no answer — a reported fact, not a state transition."
      description: |
        Raised by `SweepAcknowledgementDeadlines` for every order found still `NEW` past its `acknowledgeBy` instant (ADR 0001 §6). The sweep itself NEVER mutates the aggregate — this event re-fires on every pass for as long as the condition holds true, and a consumer must not treat it as edge-triggered. `RejectOverdueOrders` is the separate use case (its own code path, its own audit trail) that performs the actual rejection, publishing `NetworkOrderRejected` with `reason=ACKNOWLEDGEMENT_DEADLINE_MISSED`.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.AcknowledgementDeadlineAtRisk` — `dataschema`: `urn:warehouse:network-fulfillment:events:AcknowledgementDeadlineAtRisk:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/AcknowledgementDeadlineAtRiskEvent"
      examples:
        - name: acknowledgementDeadlineAtRisk
          summary: "Network order po-1's acknowledgement window has closed unanswered."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "1a2b3c4d-5e6f-4788-9900-aabbccddeeff"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.AcknowledgementDeadlineAtRisk"
            subject: "po-1"
            time: "2026-09-24T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:AcknowledgementDeadlineAtRisk:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              acknowledgeBy: "2026-09-24T08:00:00Z"
              at: "2026-09-24T08:00:00Z"

    OrphanedHoldCancelled:
      name: OrphanedHoldCancelled
      title: Orphaned order-management hold cancelled
      summary: "A hold order-management made for demand nobody decided was found past the acknowledgement window plus the grace and cancelled — a reported fact, not a state transition."
      description: |
        Raised by `SweepOrphanedHolds` (ADR 0024) once per hold it frees: the order-management order raised for this demand was still held after `acknowledgeBy` plus `ORPHAN_HOLD_GRACE`, the `NetworkOrder` was never committed to (still `NEW`, or `REJECTED` with the cancel never confirmed), and order-management confirmed the hold is gone. The sweep NEVER changes the order's state — `RejectOverdueOrders` owns that and publishes `NetworkOrderRejected` — and it raises this event only when the hold was actually freed: a hold order-management reports as already released (409/422) was not an orphan and raises nothing. The outcome is recorded in the same transaction as the event, so it fires once per hold and is not re-raised on later passes.

        `answer` is what order-management said to the cancel: `CANCELLED` (2xx) or `NOT_FOUND` (404, the hold no longer existed — still done). `localOrderId` is the order-management order that was held; it is published here and nowhere else for an order that was never submitted, because `GET /network-orders/{networkRef}` exposes `localOrderId` only from `SUBMITTED` on.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.OrphanedHoldCancelled` — `dataschema`: `urn:warehouse:network-fulfillment:events:OrphanedHoldCancelled:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: network-fulfillment
      payload:
        $ref: "#/components/schemas/OrphanedHoldCancelledEvent"
      examples:
        - name: orphanedHoldCancelled
          summary: "The hold order-management made for network order po-1 was cancelled two hours after its window closed."
          headers:
            content-type: "application/cloudevents+json; charset=UTF-8"
          payload:
            specversion: "1.0"
            id: "2b3c4d5e-6f70-4899-8011-bbccddeeff00"
            source: "/warehouse/network-fulfillment"
            type: "com.warehouse.wes.network-fulfillment.networkorder.OrphanedHoldCancelled"
            subject: "po-1"
            time: "2026-09-23T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:network-fulfillment:events:OrphanedHoldCancelled:v1"
            data:
              networkRef: "po-1"
              siteId: "site-1"
              localOrderId: "ord-1"
              acknowledgeBy: "2026-09-22T06:00:00Z"
              answer: "CANCELLED"
              at: "2026-09-23T08:00:00Z"

    NetworkOrderReceivedAnalytics:
      name: NetworkOrderReceivedAnalytics
      title: Network order received (analytics)
      summary: "Demand from the external retail network was turned into a NetworkOrder; the 24h acknowledgement clock is running."
      description: |
        Raised by the `NetworkOrder` aggregate the moment network demand is received — whether or not every line could be translated into our SKU vocabulary. `lineCount` is the number of successfully translated lines (0 for demand rejected as untranslatable). Consumed by the analytics projector.

        `type`: `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived` — `dataschema`: `urn:warehouse:network-fulfillment:analytics:NetworkOrderReceived:v1`.
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      bindings:
        kafka:
          key:
            type: string
            description: Network order reference (networkRef), identical to `subject`.
      tags:
        - name: networkorder
        - name: analytics
