name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 6am UTC, for the scheduled mutation and drift jobs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m

  # Agent-guide sensor (harness-template v3): skills load, references resolve, context budget.
  # BLOCKING: the guides are clean (0 errors); keep them that way.
  guide-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/harness/guide_lint.py
      - run: python3 scripts/harness/repo_lint.py
      - run: python3 scripts/harness/test_hook.py
      - run: python3 scripts/harness/test_red_issue.py
      - run: python3 scripts/harness/test_repo_lint.py


  # Complexity gate as its own named check: cyclomatic (gocyclo, cyclop),
  # cognitive (gocognit), nesting (nestif) and function size (funlen).
  # Thresholds live in .golangci.yml; --enable-only runs just these five
  # so violations surface under their own check name. The report step is
  # informational (step summary, functions over 10 vs the gate of 15).
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (code complexity)
  # ============================================================
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m --enable-only gocyclo,gocognit,cyclop,funlen,nestif
      - name: gocyclo report (functions over 10 — informational, gate is 15)
        if: always()
        run: |
          set -euo pipefail
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "### gocyclo — functions over 10 (informational; the gate is 15)" >> "$GITHUB_STEP_SUMMARY"
          go list -f '{{.Dir}}' ./... | grep -v '/web/' | xargs -r gocyclo -over 10 | awk '!seen[$0]++' | grep -v '/web/' | tee -a "$GITHUB_STEP_SUMMARY" || true

  # File-length budget: at most 300 lines of code per production Go file
  # (revive file-length-limit; comments and blank lines are not counted;
  # settings in .golangci.yml). Pull requests into develop: BLOCKING for every
  # Go file the PR adds or touches, so an oversized legacy file is split the
  # next time it changes. Release PRs (develop -> main), push and schedule: an
  # informational report of the whole backlog, so releases are never blocked.
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (file length)
  # ============================================================
  file-length:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - name: file length of the Go files this PR adds or touches (blocking)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m --enable-only revive --new-from-merge-base=origin/develop --whole-files
      - name: file length backlog (informational)
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m --enable-only revive --issues-exit-code=0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      # Coverage scope and gate live ONLY in the Makefile (gap 16d: a copy of
      # the package set here can drift from `make coverage`). Harness repo_lint
      # rule R11 (coverage-scope) forbids a workflow passing -coverpkg itself.
      - name: Unit tests with coverage + gate (make coverage)
        run: make coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ============================================================
  # CLASSIFICATION: BEHAVIOR TESTING (BDD / Gherkin)
  # ============================================================
  # features/*.feature run by godog (features_test.go) against the real REST
  # routers over the in-memory adapters. Scenarios tagged @known-bug describe
  # a defect and are excluded until it is fixed (docs/adr/0018).
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Run BDD (godog/Gherkin) acceptance tests
        run: go test ./... -run TestFeatures -v

  # ============================================================
  # CLASSIFICATION: CORRECTNESS (INTEGRATION, REAL POSTGRES)
  # ============================================================
  # The Postgres adapter against a real Postgres 16, started by
  # testcontainers INSIDE the test (never a DATABASE_URL service container
  # with a skip gate — a skip-gated test reports success while asserting
  # nothing, and this job would skip silently). Docker is available on
  # ubuntu-latest runners, so no service block is needed here.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Build and vet (integration tag)
        # Integration files are invisible to the default build, so a
        # signature change breaks only this job. Checked explicitly before
        # the run so the failure names the cause.
        run: |
          set -euo pipefail
          go build -tags=integration ./...
          go vet -tags=integration ./...

      - name: Integration tests
        # go test's default ceiling is 10 minutes per package, and cmd/netfulfil (every live
        # test boots the whole service) takes about that on its own: the job's limit above
        # is the real bound.
        run: go test -tags=integration ./... -race -count=1 -timeout 15m

  # ============================================================
  # CLASSIFICATION: CONTINUOUS DRIFT (advisory, weekly — never blocks a PR)
  # ============================================================
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Dead code (go tool deadcode, -test so test-only helpers don't false-positive)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.35.0
          echo "### deadcode" >> "$GITHUB_STEP_SUMMARY"
          deadcode -test ./... | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused/stale go.mod entries (go mod tidy -diff)
        run: |
          echo "### go mod tidy -diff" >> "$GITHUB_STEP_SUMMARY"
          go mod tidy -diff | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused frontend exports/files/deps (knip)
        working-directory: web
        run: |
          npm ci
          echo "### knip (web/)" >> "$GITHUB_STEP_SUMMARY"
          npx knip --no-exit-code | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Coverage quality — high-coverage functions with a surviving mutant
        run: |
          go test ./internal/domain/... -coverprofile=/tmp/cov.out -covermode=atomic
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30 > /tmp/gremlins.log 2>&1 || true
          echo "### coverage-quality" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-quality.py /tmp/cov.out /tmp/gremlins.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift --close

  # ============================================================
  # CLASSIFICATION: CONTRACT PINS (compared with the producer's develop)
  # ============================================================
  # The consumer contract test validates against a COPY of the producer's spec. A
  # copy nobody refreshes keeps that test green while the producer moves on
  # (vendor-connectivity, 2026-11-01). This job fails when a pin in
  # contracts/pinned.json differs from the producer's develop. The producer repo
  # is public; a producer that cannot be read fails the job (exit 2), never passes it.
  pinned-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pins equal the producer's develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/pinned_contract_gate.py
      - name: The gate's own tests
        run: python3 scripts/harness/test_pinned_contract_gate.py

  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (API CONTRACT)
  # ============================================================
  # The REST contract this context publishes. Read-only by design — demand
  # arrives by polling the network, never by an inbound HTTP call — so this
  # spec describes observation endpoints only, and the linter keeps the
  # published document honest about that.
  api-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install Spectral
        # `npm ci` against a pinned local package-lock.json instead of an
        # unpinned global `npm install -g`.
        run: |
          npm ci --prefix apis/tooling
          echo "$PWD/apis/tooling/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint OpenAPI spec
        run: spectral lint apis/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (fast subset — networkorder aggregate)
        run: gremlins unleash ./internal/domain/networkorder


  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (domain layer)
        run: gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation --close


  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  # ============================================================
  # CLASSIFICATION: DOCS/API DRIFT
  # Guards against the generated "API Reference" docs
  # (docs/docs/api-reference/rest/, produced by docusaurus-plugin-openapi-docs
  # from apis/openapi.yaml) drifting out of sync with the spec they're
  # supposed to mirror. Regenerates them exactly as `gen-api-docs` would and
  # fails the PR if that produces any diff -- i.e. someone changed
  # apis/openapi.yaml (or hand-edited the generated files) without running
  # `npm run gen-api-docs network-fulfillment` and committing the result.
  # ============================================================
  docs-api-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Regenerate REST API docs from apis/openapi.yaml
        run: npm run clean-api-docs network-fulfillment && npm run gen-api-docs network-fulfillment
      - name: Fail if generated docs differ from what's committed
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/api-reference/rest; then
            echo "::error::docs/api-reference/rest is out of sync with apis/openapi.yaml." \
                 "Run 'npm run gen-api-docs network-fulfillment' inside docs/ and commit the result."
            exit 1
          fi

  # Packaging validation runs for every pull request, including the normal
  # GitFlow path to develop; main-only gating left ordinary changes untested.

  # ============================================================
  # CLASSIFICATION: CHART LINT + CHART BEHAVIOUR TESTS
  # Unlike the fleet's main-only helm-lint convention, this runs on EVERY
  # PR. The chart test below asserts a fail-closed credential invariant,
  # and a credential-wiring regression that only surfaced on a
  # main-targeting PR would already have been merged to develop.
  # ============================================================
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
          check-latest: true
      - name: helm lint
        # Postgres and Kafka are mandatory, so the chart renders only with the
        # real-wiring values (database.url, kafka.brokers).
        run: |
          helm lint charts/network-fulfillment -f charts/network-fulfillment/ci/real-wiring-values.yaml
          helm lint charts/network-fulfillment -f charts/network-fulfillment/ci/all-components-values.yaml
      - name: Chart wiring tests
        # Both suites run on every PR, deliberately. process-path-management
        # has a render-assertion script that is NOT wired to CI and only
        # runs if somebody remembers — which is how it rots.
        run: |
          pip install --require-hashes -r .github/requirements/chart-tests.txt
          bash charts/network-fulfillment/tests/render_test.sh
          python3 charts/network-fulfillment/tests/test_credential_wiring.py
          python3 charts/network-fulfillment/tests/test_data_files.py
          python3 charts/network-fulfillment/tests/test_env_parity.py
          python3 charts/network-fulfillment/tests/test_kong_config.py

  # ============================================================
  # CLASSIFICATION: PACKAGING (Helm chart tests)
  # Runs on EVERY push and PR (unlike helm-lint): the chart tests guard
  # behaviour, not packaging -- the env ConfigMap mounted via envFrom (gap
  # fix D14), every Service selecting exactly one Deployment, Kong config.
  # Every charts/network-fulfillment/tests/*.sh and test_*.py runs here (repo_lint
  # R9 fails a chart test no workflow runs). PyYAML is installed hash-pinned
  # (Scorecard Pinned-Dependencies), and a test that prints SKIP fails the
  # job: a selector test must never pass vacuously.
  # ============================================================
  chart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install PyYAML (hash-pinned)
        run: python3 -m pip install --require-hashes -r .github/requirements/chart-tests.txt
      - name: Chart tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(charts/network-fulfillment/tests/*.sh charts/network-fulfillment/tests/test_*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::warning::no chart tests in charts/network-fulfillment/tests: add a render test asserting the envFrom mount and a Service selector test"
            exit 0
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            status=0
            case "$t" in
              *.sh) out=$(bash "$t" 2>&1) || status=$? ;;
              *) out=$(python3 "$t" 2>&1) || status=$? ;;
            esac
            echo "$out"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$t failed"
              exit "$status"
            fi
            if grep -q '^SKIP' <<<"$out"; then
              echo "::error::$t printed SKIP: a chart test must not pass vacuously (is PyYAML or helm missing?)"
              exit 1
            fi
          done


  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Architecture fitness tests
        run: go test ./internal/architecture/... -v

  # ============================================================
  # CLASSIFICATION: CONTRACT TESTING (producer breaking-change gate)
  # ============================================================
  # A PR that edits this repo's API specs must not break the consumers that pin
  # them (contracts/pinned.json in the consumer repos). REST: oasdiff v1.38.0, the
  # sha256-pinned release tarball, `breaking --fail-on ERR` (without --fail-on
  # oasdiff prints breaking changes and still exits 0: the gate would be vacuous).
  # One fleet rule for REST and events: an enum value ADDED to a response property
  # is a warning, not a failure (--severity-levels, written by the job itself).
  # Events: scripts/harness/asyncapi_breaking.py (oasdiff cannot read AsyncAPI).
  # Skips itself when the PR touches no apis/openapi*.yaml or apis/asyncapi.yaml.
  # Kit: docs/spec-breaking-kit.md. The two ACTIONS_* placeholder tokens are substituted by
  # the rollout with the `uses:` values this repo already pins elsewhere in this file.
  spec-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    env:
      # Through env, never interpolated into a run: script.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # the PR base sha must be in the history to diff against
      - name: Did this PR touch an API spec?
        id: apis
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD -- 'apis/openapi*.yaml' > "$RUNNER_TEMP/openapi-changed.txt"
          if [ -s "$RUNNER_TEMP/openapi-changed.txt" ]; then echo "openapi=true" >> "$GITHUB_OUTPUT"; else echo "openapi=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --name-only "$BASE_SHA" HEAD -- apis/asyncapi.yaml | grep -q .; then echo "asyncapi=true" >> "$GITHUB_OUTPUT"; else echo "asyncapi=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -s "$RUNNER_TEMP/openapi-changed.txt" ] && ! git diff --name-only "$BASE_SHA" HEAD -- apis/asyncapi.yaml | grep -q .; then
            echo "No apis/openapi*.yaml or apis/asyncapi.yaml change: nothing for the breaking gate to diff"
          fi
      # Best effort and never failing: the consumers named in the failure text come
      # from the fleet's own registries (contracts/pinned.json at each repo's develop).
      - name: Name the consumers that pin this repo's specs
        id: consumers
        if: steps.apis.outputs.openapi == 'true' || steps.apis.outputs.asyncapi == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, re, subprocess
          producer = os.environ["PRODUCER"]
          org = producer.split("/")[0]
          def gh(*args):
              return subprocess.run(["gh", "api", *args], capture_output=True, text=True, timeout=60)
          def pins(repo):
              out = gh("-H", "Accept: application/vnd.github.raw", f"repos/{org}/{repo}/contents/contracts/pinned.json?ref=develop")
              if out.returncode != 0:
                  return repo, []
              try:
                  return repo, [p for p in json.loads(out.stdout).get("pins", []) if p.get("repo") == producer]
              except (ValueError, AttributeError):
                  return repo, []
          rest, events = set(), set()
          try:
              listing = gh("--paginate", f"orgs/{org}/repos?per_page=100", "--jq", ".[] | select(.archived | not) | .name")
              if listing.returncode != 0:
                  raise RuntimeError(listing.stderr.strip() or "repo listing failed")
              with concurrent.futures.ThreadPoolExecutor(8) as pool:
                  for repo, found in pool.map(pins, listing.stdout.split()):
                      for pin in found:
                          base = os.path.basename(str(pin.get("path", "")))
                          if re.fullmatch(r"[A-Za-z0-9._-]+", repo) and base.startswith("openapi"):
                              rest.add(repo)
                          elif re.fullmatch(r"[A-Za-z0-9._-]+", repo) and base.startswith("asyncapi"):
                              events.add(repo)
          except Exception as exc:  # the lookup is advice, never a gate
              print(f"::notice::consumer lookup unavailable ({exc}); the gate still runs with a generic message")
              rest, events = set(), set()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"rest={','.join(sorted(rest))}\nevents={','.join(sorted(events))}\n")
          print("REST pinners:", sorted(rest), "| event pinners:", sorted(events))
          PY
      - name: Install oasdiff v1.38.0 (sha256-pinned release tarball)
        if: steps.apis.outputs.openapi == 'true'
        env:
          # Official checksums.txt of https://github.com/oasdiff/oasdiff/releases/tag/v1.38.0
          OASDIFF_SHA256: 613037fd6a1d3362a1b742d6d86c338c0eb5ab3511f4942ce3948e78720ea2da
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/oasdiff_1.38.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$tarball" \
            "https://github.com/oasdiff/oasdiff/releases/download/v1.38.0/oasdiff_1.38.0_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  $tarball" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/oasdiff-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/oasdiff-bin" oasdiff
          echo "$RUNNER_TEMP/oasdiff-bin" >> "$GITHUB_PATH"
      - name: oasdiff breaking - apis/openapi*.yaml, PR base vs head
        if: steps.apis.outputs.openapi == 'true'
        env:
          CONSUMERS: ${{ steps.consumers.outputs.rest }}
        run: |
          set -euo pipefail
          # Fleet decision (docs/spec-breaking-kit.md, "REST: a response enum value added is a
          # warning"): the same rule as the event gate. The override is written here, never read
          # from the repo, so no file in a PR can weaken the gate; every other check keeps
          # oasdiff's own level.
          printf 'response-property-enum-value-added\twarn\n' > "$RUNNER_TEMP/oasdiff-severity-levels.txt"
          status=0
          while IFS= read -r spec; do
            [ -n "$spec" ] || continue
            if ! git cat-file -e "$BASE_SHA:$spec" 2>/dev/null; then
              echo "$spec is new in this PR: nothing to compare"
              continue
            fi
            if [ ! -f "$spec" ]; then
              echo "::error::$spec was deleted: every consumer pinning it breaks. Keep it, or migrate the consumers first."
              status=1
              continue
            fi
            git show "$BASE_SHA:$spec" > "$RUNNER_TEMP/base-openapi.yaml"
            # --fail-on ERR is load-bearing: oasdiff v1.38.0 exits 0 on breaking changes without it.
            rc=0
            oasdiff breaking --fail-on ERR --severity-levels "$RUNNER_TEMP/oasdiff-severity-levels.txt" "$RUNNER_TEMP/base-openapi.yaml" "$spec" > "$RUNNER_TEMP/oasdiff-breaking.txt" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/oasdiff-breaking.txt"
            if [ "$rc" -ne 0 ]; then
              echo "::error::Breaking REST change in $spec vs $BASE_REF. Pinning consumers: ${CONSUMERS:-see contracts/pinned.json@develop in the consumer repos}. Make the change additive, or refresh the consumers' pins first."
              status=1
            fi
            # Advisory only: an `if` condition never fails the step, whatever grep returns.
            if grep -qF '[response-property-enum-value-added]' "$RUNNER_TEMP/oasdiff-breaking.txt"; then
              echo "::warning::$spec adds enum value(s) to a response property: a warning, not a failure (docs/spec-breaking-kit.md). REST clients must tolerate unknown enum values."
            fi
          done < "$RUNNER_TEMP/openapi-changed.txt"
          exit "$status"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.apis.outputs.asyncapi == 'true'
        with:
          python-version: "3.13"
      - name: Install PyYAML (hash-pinned)
        if: steps.apis.outputs.asyncapi == 'true'
        run: python3 -m pip install --require-hashes -r .github/requirements/asyncapi-breaking.txt
      - name: The gate's own tests
        if: steps.apis.outputs.asyncapi == 'true'
        run: |
          python3 scripts/harness/asyncapi_breaking.py --self-check
          python3 scripts/harness/test_asyncapi_breaking.py
      - name: Breaking gate - apis/asyncapi.yaml, PR base vs head
        if: steps.apis.outputs.asyncapi == 'true'
        env:
          CONSUMERS: ${{ steps.consumers.outputs.events }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA:apis/asyncapi.yaml" 2>/dev/null; then
            echo "apis/asyncapi.yaml is new in this PR: nothing to compare"
            exit 0
          fi
          if [ ! -f apis/asyncapi.yaml ]; then
            echo "::error::apis/asyncapi.yaml was deleted: every consumer pinning it breaks. Keep it, or migrate the consumers first."
            exit 1
          fi
          git show "$BASE_SHA:apis/asyncapi.yaml" > "$RUNNER_TEMP/base-asyncapi.yaml"
          python3 scripts/harness/asyncapi_breaking.py "$RUNNER_TEMP/base-asyncapi.yaml" apis/asyncapi.yaml

  # Shift-left container scan: builds the image (no push) on every push AND
  # every PR, so a vulnerable base image or dependency is caught before
  # merge, not just at publish time. Blocks on CRITICAL/HIGH with a known
  # fix; findings also land in the repo's Security tab (SARIF) regardless
  # of pass/fail so history is visible even when nothing blocks.
  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (container image)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: network-fulfillment:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Trivy scan (SARIF, always uploaded)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: 'network-fulfillment:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: "Trivy scan (blocking gate: CRITICAL/HIGH with a fix available)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'network-fulfillment:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # node-topology-mfe (web/) is a Module Federation remote consumed by the
  # warehouse-console shell; it depends on @warehouse/ui-kit via
  # `file:../../warehouse-ui-kit`, so warehouse-ui-kit is checked out as a
  # SIBLING directory here (matching warehouse-console's own CI shape) so that
  # relative path resolves the same way it does on a contributor's machine.
  # lint + typecheck (tsc -b) + vitest unit/component tests + production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: network-fulfillment/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: network-fulfillment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # ============================================================
  # CLASSIFICATION: PUBLISH (Docker image) -- push-to-main only
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, complexity, test, bdd, integration, mutation-fast, vuln, api-lint, arch-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/iqvo/network-fulfillment:latest
            ghcr.io/iqvo/network-fulfillment:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the published image (keyless, GitHub OIDC identity)
        run: |
          cosign sign --yes \
            ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
      - name: Generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest the image with its SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on GHCR.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  # ============================================================
  # CLASSIFICATION: PUBLISH (GitHub release + Helm chart) -- push-to-main only
  # ============================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }} \
            ghcr.io/iqvo/network-fulfillment:${{ env.SHORT_SHA }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.4
      - name: Package and publish the Helm chart for this release
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${CHART_VERSION#v}"
          mkdir -p /tmp/chart-out
          helm package charts/network-fulfillment \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d /tmp/chart-out
          echo "CHART_TGZ=/tmp/chart-out/network-fulfillment-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/network-fulfillment-${CHART_VERSION}.tgz" \
            oci://ghcr.io/iqvo
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.CHART_TGZ }}
          body: |
            Docker image: `ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

            Helm chart: `oci://ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }}`
            (also attached below as a `.tgz`)
