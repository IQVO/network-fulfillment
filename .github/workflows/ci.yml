name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 6am UTC, for the scheduled mutation and drift jobs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m

  # Agent-guide sensor (harness-template v3): skills load, references resolve, context budget.
  # BLOCKING: the guides are clean (0 errors); keep them that way.
  guide-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/harness/guide_lint.py
      - run: python3 scripts/harness/repo_lint.py
      - run: python3 scripts/harness/test_hook.py
      - run: python3 scripts/harness/test_red_issue.py
      - run: python3 scripts/harness/test_repo_lint.py


  # Complexity gate as its own named check: cyclomatic (gocyclo, cyclop),
  # cognitive (gocognit), nesting (nestif) and function size (funlen).
  # Thresholds live in .golangci.yml; --enable-only runs just these five
  # so violations surface under their own check name. The report step is
  # informational (step summary, functions over 10 vs the gate of 15).
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (code complexity)
  # ============================================================
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m --enable-only gocyclo,gocognit,cyclop,funlen,nestif
      - name: gocyclo report (functions over 10 — informational, gate is 15)
        if: always()
        run: |
          set -euo pipefail
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "### gocyclo — functions over 10 (informational; the gate is 15)" >> "$GITHUB_STEP_SUMMARY"
          go list -f '{{.Dir}}' ./... | grep -v '/web/' | xargs -r gocyclo -over 10 | awk '!seen[$0]++' | grep -v '/web/' | tee -a "$GITHUB_STEP_SUMMARY" || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      # Coverage scope and gate live ONLY in the Makefile (gap 16d: a copy of
      # the package set here can drift from `make coverage`). Harness repo_lint
      # rule R11 (coverage-scope) forbids a workflow passing -coverpkg itself.
      - name: Unit tests with coverage + gate (make coverage)
        run: make coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ============================================================
  # CLASSIFICATION: BEHAVIOR TESTING (BDD / Gherkin)
  # ============================================================
  # features/*.feature run by godog (features_test.go) against the real REST
  # routers over the in-memory adapters. Scenarios tagged @known-bug describe
  # a defect and are excluded until it is fixed (docs/adr/0018).
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run BDD (godog/Gherkin) acceptance tests
        run: go test ./... -run TestFeatures -v

  # ============================================================
  # CLASSIFICATION: CORRECTNESS (INTEGRATION, REAL POSTGRES)
  # ============================================================
  # The Postgres adapter against a real Postgres 16, started by
  # testcontainers INSIDE the test (never a DATABASE_URL service container
  # with a skip gate — a skip-gated test reports success while asserting
  # nothing, and this job would skip silently). Docker is available on
  # ubuntu-latest runners, so no service block is needed here.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build and vet (integration tag)
        # Integration files are invisible to the default build, so a
        # signature change breaks only this job. Checked explicitly before
        # the run so the failure names the cause.
        run: |
          set -euo pipefail
          go build -tags=integration ./...
          go vet -tags=integration ./...

      - name: Integration tests
        # go test's default ceiling is 10 minutes per package, and cmd/netfulfil (every live
        # test boots the whole service) takes about that on its own: the job's limit above
        # is the real bound.
        run: go test -tags=integration ./... -race -count=1 -timeout 15m

  # ============================================================
  # CLASSIFICATION: CONTINUOUS DRIFT (advisory, weekly — never blocks a PR)
  # ============================================================
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Dead code (go tool deadcode, -test so test-only helpers don't false-positive)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.35.0
          echo "### deadcode" >> "$GITHUB_STEP_SUMMARY"
          deadcode -test ./... | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused/stale go.mod entries (go mod tidy -diff)
        run: |
          echo "### go mod tidy -diff" >> "$GITHUB_STEP_SUMMARY"
          go mod tidy -diff | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused frontend exports/files/deps (knip)
        working-directory: web
        run: |
          npm ci
          echo "### knip (web/)" >> "$GITHUB_STEP_SUMMARY"
          npx knip --no-exit-code | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Coverage quality — high-coverage functions with a surviving mutant
        run: |
          go test ./internal/domain/... -coverprofile=/tmp/cov.out -covermode=atomic
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30 > /tmp/gremlins.log 2>&1 || true
          echo "### coverage-quality" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-quality.py /tmp/cov.out /tmp/gremlins.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift --close

  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (API CONTRACT)
  # ============================================================
  # The REST contract this context publishes. Read-only by design — demand
  # arrives by polling the network, never by an inbound HTTP call — so this
  # spec describes observation endpoints only, and the linter keeps the
  # published document honest about that.
  api-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install Spectral
        # `npm ci` against a pinned local package-lock.json instead of an
        # unpinned global `npm install -g`.
        run: |
          npm ci --prefix apis/tooling
          echo "$PWD/apis/tooling/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint OpenAPI spec
        run: spectral lint apis/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (fast subset — networkorder aggregate)
        run: gremlins unleash ./internal/domain/networkorder


  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (domain layer)
        run: gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation --close


  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  # Packaging validation runs for every pull request, including the normal
  # GitFlow path to develop; main-only gating left ordinary changes untested.

  # ============================================================
  # CLASSIFICATION: CHART LINT + CHART BEHAVIOUR TESTS
  # Unlike the fleet's main-only helm-lint convention, this runs on EVERY
  # PR. The chart test below asserts a fail-closed credential invariant,
  # and a credential-wiring regression that only surfaced on a
  # main-targeting PR would already have been merged to develop.
  # ============================================================
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          check-latest: true
      - name: helm lint
        # Postgres and Kafka are mandatory, so the chart renders only with the
        # real-wiring values (database.url, kafka.brokers).
        run: |
          helm lint charts/network-fulfillment -f charts/network-fulfillment/ci/real-wiring-values.yaml
          helm lint charts/network-fulfillment -f charts/network-fulfillment/ci/all-components-values.yaml
      - name: Chart wiring tests
        # Both suites run on every PR, deliberately. process-path-management
        # has a render-assertion script that is NOT wired to CI and only
        # runs if somebody remembers — which is how it rots.
        run: |
          pip install --require-hashes -r .github/requirements/chart-tests.txt
          bash charts/network-fulfillment/tests/render_test.sh
          python3 charts/network-fulfillment/tests/test_credential_wiring.py
          python3 charts/network-fulfillment/tests/test_data_files.py
          python3 charts/network-fulfillment/tests/test_env_parity.py
          python3 charts/network-fulfillment/tests/test_kong_config.py

  # ============================================================
  # CLASSIFICATION: PACKAGING (Helm chart tests)
  # Runs on EVERY push and PR (unlike helm-lint): the chart tests guard
  # behaviour, not packaging -- the env ConfigMap mounted via envFrom (gap
  # fix D14), every Service selecting exactly one Deployment, Kong config.
  # Every charts/network-fulfillment/tests/*.sh and test_*.py runs here (repo_lint
  # R9 fails a chart test no workflow runs). PyYAML is installed hash-pinned
  # (Scorecard Pinned-Dependencies), and a test that prints SKIP fails the
  # job: a selector test must never pass vacuously.
  # ============================================================
  chart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install PyYAML (hash-pinned)
        run: python3 -m pip install --require-hashes -r .github/requirements/chart-tests.txt
      - name: Chart tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(charts/network-fulfillment/tests/*.sh charts/network-fulfillment/tests/test_*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::warning::no chart tests in charts/network-fulfillment/tests: add a render test asserting the envFrom mount and a Service selector test"
            exit 0
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            status=0
            case "$t" in
              *.sh) out=$(bash "$t" 2>&1) || status=$? ;;
              *) out=$(python3 "$t" 2>&1) || status=$? ;;
            esac
            echo "$out"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$t failed"
              exit "$status"
            fi
            if grep -q '^SKIP' <<<"$out"; then
              echo "::error::$t printed SKIP: a chart test must not pass vacuously (is PyYAML or helm missing?)"
              exit 1
            fi
          done


  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Architecture fitness tests
        run: go test ./internal/architecture/... -v

  # Shift-left container scan: builds the image (no push) on every push AND
  # every PR, so a vulnerable base image or dependency is caught before
  # merge, not just at publish time. Blocks on CRITICAL/HIGH with a known
  # fix; findings also land in the repo's Security tab (SARIF) regardless
  # of pass/fail so history is visible even when nothing blocks.
  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (container image)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: network-fulfillment:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Trivy scan (SARIF, always uploaded)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: 'network-fulfillment:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: "Trivy scan (blocking gate: CRITICAL/HIGH with a fix available)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'network-fulfillment:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # node-topology-mfe (web/) is a Module Federation remote consumed by the
  # warehouse-console shell; it depends on @warehouse/ui-kit via
  # `file:../../warehouse-ui-kit`, so warehouse-ui-kit is checked out as a
  # SIBLING directory here (matching warehouse-console's own CI shape) so that
  # relative path resolves the same way it does on a contributor's machine.
  # lint + typecheck (tsc -b) + vitest unit/component tests + production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: network-fulfillment/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: network-fulfillment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # ============================================================
  # CLASSIFICATION: PUBLISH (Docker image) -- push-to-main only
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, complexity, test, bdd, integration, mutation-fast, vuln, api-lint, arch-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/iqvo/network-fulfillment:latest
            ghcr.io/iqvo/network-fulfillment:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published image (keyless, GitHub OIDC identity)
        run: |
          cosign sign --yes \
            ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
      - name: Generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest the image with its SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ghcr.io/iqvo/network-fulfillment@${{ steps.build.outputs.digest }}
      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on GHCR.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  # ============================================================
  # CLASSIFICATION: PUBLISH (GitHub release + Helm chart) -- push-to-main only
  # ============================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }} \
            ghcr.io/iqvo/network-fulfillment:${{ env.SHORT_SHA }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - name: Package and publish the Helm chart for this release
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${CHART_VERSION#v}"
          mkdir -p /tmp/chart-out
          helm package charts/network-fulfillment \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d /tmp/chart-out
          echo "CHART_TGZ=/tmp/chart-out/network-fulfillment-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/network-fulfillment-${CHART_VERSION}.tgz" \
            oci://ghcr.io/iqvo
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.CHART_TGZ }}
          body: |
            Docker image: `ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

            Helm chart: `oci://ghcr.io/iqvo/network-fulfillment:${{ steps.version.outputs.version }}`
            (also attached below as a `.tgz`)
