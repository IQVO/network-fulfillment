# lefthook.yml — git hooks template (warehouse-harness-template v2).
#
# One-time local activation (hooks are NOT tracked in git, so every clone must
# do this once):
#
#   brew install lefthook          # or: go install github.com/evilmartians/lefthook@latest
#   lefthook install
#
# The hooks are thin wrappers around the Makefile so there is exactly ONE
# definition of each sensor (see Makefile / .github/workflows/ci.yml).
# Nothing here needs a database: `integration` and `mutation` are deliberately
# excluded so committing and pushing stay fast and offline-friendly.

min_version: 1.7.0

# Fast structural sensors only — must stay snappy enough to run on every commit.
pre-commit:
  parallel: false
  jobs:
    - name: fmt-check
      run: |
        command -v make >/dev/null 2>&1 || {
          echo "lefthook/pre-commit: 'make' is not installed or not on PATH — cannot run the quality gate."
          exit 1
        }
        make fmt-check
    - name: vet
      run: make vet
    - name: lint
      run: make lint

# The last gate before code leaves the machine: adds build + the race test suite.
pre-push:
  parallel: false
  jobs:
    - name: check
      run: |
        command -v make >/dev/null 2>&1 || {
          echo "lefthook/pre-push: 'make' is not installed or not on PATH — cannot run the quality gate."
          exit 1
        }
        make check
