# .gremlins.yaml — mutation-testing configuration template (warehouse-harness-template v1).
#
# gremlins (github.com/go-gremlins/gremlins, pinned to v0.6.0 in CI) reads
# this file automatically from the Go module root, so the `mutation-fast`
# CI job, the scheduled exhaustive `mutation` CI job, the `drift` job's
# coverage-quality check, and the local `make mutation` / `make
# mutation-full` targets all run with identical settings.
#
# Mutation testing is the sensor that tells us whether the tests actually
# ASSERT rather than merely execute. The thresholds below turn it into a
# blocking quality gate instead of a report.
silent: false

unleash:
  # A single worker with a generous timeout coefficient avoids spurious
  # TIMED OUT results on modules where mutants finish in tens of
  # milliseconds but parallel workers contend over the build cache.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # gremlins fails when the measured value is <= the threshold
    # (internal/report/report.go in gremlins itself), so a threshold must
    # sit strictly BELOW the number this repo can meet today. Measure
    # first (`make mutation-full`), THEN set these -- don't guess/copy a
    # sibling repo's numbers, every domain layer's mutant survivability
    # differs. See HARNESS.md's mutation-testing section for the
    # tagless-switch-under-reports pitfall before assuming a low number
    # means missing tests.
    #
    # Measured today on ./internal/domain/networkorder (`gremlins unleash
    # ./internal/domain/networkorder`, single worker, after the 4 domain
    # events + their use-case wiring landed): Killed 14, Lived 0,
    # Not covered 1 (ARITHMETIC_BASE on the AcknowledgementWindow const
    # declaration itself -- a const has no runtime coverage line to
    # mutate against, so this one is not closable by adding tests).
    # Test efficacy 100.00%, mutator coverage 93.33%. Thresholds below
    # sit strictly below both, with headroom for legitimate new mutants
    # as the domain grows rather than sitting right at the wire.
    efficacy: 99
    mutant-coverage: 92
