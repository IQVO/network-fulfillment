# Default values for network-fulfillment.

replicaCount: 1

image:
  repository: ghcr.io/claudioed/network-fulfillment
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: network-fulfillment.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress block above.
# Mirrors the shape verified live in warehouse-infra's Gateway API pilot.
# Flip gatewayApi.enabled: true and set real parentRefs to switch this
# service from Ingress to HTTPRoute; leaving it false is a strict no-op.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# This context holds NO database and NO Kafka connection. Its whole
# configuration surface is these five variables (cmd/netfulfil/main.go plus
# corsAllowedOrigins for the inbound HTTP adapter's CORS middleware).
config:
  port: "8080"

  # How often the network is polled. Inbound is a poll and nothing else
  # (ADR 0001 section 5), so this is the only thing that brings demand in.
  # Far below the 24h acknowledgement window on purpose: a slow or stopped
  # poller spends a deadline somebody else set.
  pollInterval: "1m"

  # stub | sandbox | live.
  #
  # stub is the default ON PURPOSE. It makes no external calls and needs
  # no credentials, so a default `helm install`, the kind cluster, and
  # the e2e suite all work with nothing configured -- and none of them
  # can accidentally acknowledge a real retailer's order.
  #
  # sandbox and live REQUIRE credentials below and the pod refuses to
  # start without them. That refusal is deliberate: silently degrading to
  # stub would leave a pod that looks healthy while quietly acknowledging
  # nothing the network sent.
  networkMode: "stub"

  # order-management's in-cluster REST base URL. The one upstream this
  # context calls; the default matches the fleet's service naming.
  orderManagementUrl: "http://order-management.warehouse.svc.cluster.local"

  # How often the acknowledgement-deadline sweep runs. Every unanswered
  # order past its 24h window is sitting on real inventory reservations,
  # so this decides how long the floor stays blocked by demand the
  # network never confirmed.
  sweepInterval: "5m"

  # Browser origins allowed to call this read-only API directly
  # (internal/adapters/inbound/http/server.go's corsMiddleware).
  # 5173 is warehouse-console's own dev port, always included; 5188 is
  # this context's own netfulfil_mfe remote dev port (web/vite.config.ts).
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5188"

# External-network credentials. Used ONLY when config.networkMode is
# "sandbox" or "live" -- in stub mode nothing here is read and no Secret
# is created, which is what keeps local installs credential-free.
#
# Set existingSecret to point at a Secret you manage yourself (its keys
# must be named NETWORK_CLIENT_ID / NETWORK_CLIENT_SECRET /
# NETWORK_REFRESH_TOKEN). Prefer that over the inline values below for
# anything that is not a throwaway sandbox: inline values land in the
# release's stored manifest in plain text.
credentials:
  existingSecret: ""
  clientId: ""
  clientSecret: ""
  refreshToken: ""

# The Anti-Corruption Layer's dictionary: the network's product identifier
# to our SKU, rendered into a ConfigMap and mounted as a file.
#
# EMPTY BY DEFAULT, AND THAT IS NOT HARMLESS. With no mappings every order
# the network sends is rejected as untranslatable: the pod is healthy, the
# poller works, and the answer is always no. The service logs a WARNING at
# startup when this is empty, because the symptom on its own looks exactly
# like a network asking only for products we do not stock.
#
# There is deliberately no default mapping. This is curated business data —
# nobody can derive which of our SKUs an external identifier means, and a
# plausible-looking fake would be worse than an empty dictionary.
productTranslation:
  mappings: []
  # - networkProductId: ASIN-XYZ123
  #   sku: sku-1

# Declarative demand for a STUB run: the same pattern as this fleet's
# PATH_CATALOGUE_FILE, and the reason this context needs no write endpoint.
#
# requiredShipBy accepts an RFC 3339 instant or a duration relative to now
# ("+36h"). Prefer the relative form: a fixed instant goes stale and every
# order becomes instantly infeasible, which reads like a promise bug rather
# than an expired fixture.
#
# Ignored unless config.networkMode is "stub" — the binary REFUSES to boot
# if a seed file is set against a real gateway, because seeded demand would
# never be delivered and somebody would be waiting for it.
stubDemand:
  demands: []
  # - networkRef: po-4711
  #   siteId: site-1
  #   requiredShipBy: "+36h"
  #   lines:
  #     - networkLineRef: "1"
  #       networkProductId: ASIN-XYZ123
  #       quantity: 3

# Persistence. With BOTH left empty the binary runs on its in-memory
# repository: that is the zero-configuration local run (ADR 0001 section 4),
# and it is deliberately the default so a `helm install` with no values
# needs no database to exist.
#
# It is NOT an acceptable production posture. An in-memory repo forgets
# every acknowledgement deadline this context owes the network on restart,
# and pods in this fleet restart once at rollout by design — so a real
# deployment sets database.url (or existingSecret) and the binary then
# REFUSES to boot if Postgres is unreachable, rather than silently falling
# back to the map.
#
# Prefer existingSecret outside a throwaway cluster: an inline url lands in
# the release's stored manifest in plain text.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a
# Collector; the service never exposes a Prometheus scrape endpoint of
# its own. An unreachable endpoint is not fatal -- the exporters dial
# lazily, so the pod still starts and serves, it just drops telemetry.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "network-fulfillment"

extraEnv: []

# Gates liveness and readiness until the process is actually serving.
#
# Without it, BOOT WORK RACES THE LIVENESS PROBE and loses: this service
# runs migrations before it starts listening, and in this cluster every
# injected pod's first outbound dial is reset ~10s after start (Istio
# native sidecars), so the first migration attempt fails and the retry
# pushes first-listen past the liveness threshold. Observed live as
# CrashLoopBackOff with exit code 143 — SIGTERM, the kubelet killing a pod
# that was still booting, which reads like an app crash and is not one.
#
# 30 x 2s = 60s of grace, comfortably past the retry budget in
# cmd/netfulfil/main.go, after which liveness takes over unchanged. A
# genuinely broken database still fails the pod; it just is not mistaken
# for a slow one.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# The netfulfil_mfe Module Federation remote: a static SPA bundle served by
# its own nginx pod, reached through warehouse-infra's Nginx web gateway at
# /mfes/network-fulfillment/. Deliberately a SEPARATE workload from the OLTP
# API above -- Kong never routes to it, and the OLTP Service must never
# select it (see the distinct app.kubernetes.io/component labels on both
# Deployments/Services in this chart).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/network-fulfillment-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
