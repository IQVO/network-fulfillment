# Default values for network-fulfillment.

replicaCount: 1

image:
  repository: ghcr.io/iqvo/network-fulfillment
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod terminationGracePeriodSeconds of the api Deployment. The binary's graceful
# shutdown flips /readyz, stops the consumers, drains HTTP and waits for the
# outbox relay; the chart refuses anything under 20.
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: network-fulfillment.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress block above.
# Mirrors the shape verified live in warehouse-infra's Gateway API pilot.
# Flip gatewayApi.enabled: true and set real parentRefs to switch this
# service from Ingress to HTTPRoute; leaving it false is a strict no-op.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever — the fleet's endpoints
# are unauthenticated and the gateway adds no authentication or
# authorization.
kongPlugins:
  cors:
    enabled: false
    # Exact browser origin, never "*" (endpoints are unauthenticated).
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    # OTLP/HTTP traces endpoint of the fleet collector; needs Kong started
    # with KONG_TRACING_INSTRUMENTATIONS or the plugin exports zero spans.
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type, ported from order-management's Phase 3 reference PR
# (ADR 0026) -- see docs/adr/0006-horizontal-autoscaling-and-pgxpool-
# tuning.md for the full per-workload reasoning. Every block below
# defaults `enabled: false` so this PR cannot silently change production
# replica behaviour on merge. When a component's autoscaling.<x>.enabled
# is true, that Deployment's own replicaCount value is OMITTED from the
# rendered manifest (see each deployment template's `{{- if not
# .Values.autoscaling.<x>.enabled }}` guard) so the HPA controller is the
# SOLE owner of .spec.replicas -- a hardcoded `replicas:` field competing
# with the HPA would otherwise fight it on every reconcile.
#
# analytics-projector and mcp deliberately have NO block here (skipped,
# not just disabled) -- see their own values below (analytics.projector,
# mcp) for why each is not safely horizontally scalable as built today.
autoscaling:
  # cmd/netfulfil (this Deployment): stateless OLTP HTTP service plus an
  # inbound poller (internal/adapters/inbound/poller) and acknowledgement
  # sweep, both driven by this same process's own ticker. The api DOES
  # consume Kafka: the two capability-offer caches (process-path and
  # work-planning topics) each derive their own consumer-group id and replay
  # from the earliest offset, so every replica holds a full cache and there
  # is no group-id collision. The outbox relay is an OUTBOUND publisher that
  # every replica may run independently. Every api replica
  # shares the SAME Postgres-backed NetworkOrderRepo (Postgres is the only
  # runtime, there is no in-process store), so N replicas read/write one
  # consistent store. max 4 / target 70% CPU, matching
  # order-management's identically-shaped api Deployment.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/netfulfil-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, no Kafka consumption, same treatment as order-management's
  # analytics-reports Deployment. max 3 / target 70% CPU.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (netfulfil_mfe Module Federation remote, nginx-unprivileged
  # serving the built SPA bundle): pure static-asset serving, no
  # server-side session or per-request state whatsoever -- the most
  # trivially horizontally scalable workload in this chart. max 3 /
  # target 70% CPU.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# This context's OLTP configuration surface (cmd/netfulfil/main.go), plus
# corsAllowedOrigins for the inbound HTTP adapter's CORS middleware. Postgres
# (database.*) and Kafka (kafka.brokers) are REQUIRED: the chart refuses to
# render without them.
config:
  port: "8080"

  # kafka is the only value. Domain events go through the transactional outbox
  # and its relay, which fans out to BOTH the integration topic
  # (warehouse.network-fulfillment.events) and the analytics topic
  # (warehouse.network-fulfillment.analytics) -- see cmd/netfulfil's
  # wireEventPublisher. The key is kept because warehouse-infra sets it; any
  # other value (the old "log") is refused at render and by the binary at boot.
  eventPublisher: "kafka"

  # Outbox relay attempt cap (ADR 0021); OUTBOX_MAX_ATTEMPTS. The relay is
  # always on. A row that has failed
  # this many sends is excluded from the relay's claims and logged at ERROR
  # (it stays in outbox_events; re-arm it with attempts = 0, see the
  # runbook). Later rows, including rows with the same key, then overtake it.
  # 0 = unlimited (one poison row blocks the relay forever).
  outboxMaxAttempts: 20

  # Orphaned-hold sweep (ADR 0024, gap OM-0020). A demand this context cannot
  # meet is HELD in order-management, which reserves real inventory and has no
  # timeout of its own. If nothing decides the order (a failed cancel, a missed
  # window) the sweep cancels that hold on the SWEEP_INTERVAL ticker once
  # acknowledgeBy + orphanHoldGrace has passed, and reports
  # OrphanedHoldCancelled.
  #
  # ON by default: a leaked hold is the worse failure. false turns the pass
  # off (ORPHAN_HOLD_SWEEP_ENABLED); an unparseable value keeps it on.
  orphanHoldSweepEnabled: true
  # A Go duration added to acknowledgeBy (ORPHAN_HOLD_GRACE). It lets
  # RejectOverdueOrders, on the same ticker, do its own work first, so the
  # sweep is a backstop and never a second actor racing it. "0" means no grace.
  orphanHoldGrace: "1h"

  # How often the network is polled. Inbound is a poll and nothing else
  # (ADR 0001 section 5), so this is the only thing that brings demand in.
  # Far below the 24h acknowledgement window on purpose: a slow or stopped
  # poller spends a deadline somebody else set.
  pollInterval: "1m"

  # stub | live.
  #
  # stub is the default ON PURPOSE. It makes no external calls and needs
  # no credentials, so a default `helm install`, the kind cluster, and
  # the e2e suite all work with nothing configured -- and none of them
  # can accidentally acknowledge a real retailer's order.
  #
  # live (ADR 0026) calls the retail network's Vendor API. It REQUIRES
  # networkBaseUrl and networkVendorId (the chart refuses to render without
  # them, and the binary refuses to start without them). That refusal is
  # deliberate: silently degrading to stub would leave a pod that looks
  # healthy while quietly acknowledging nothing the network sent. Live takes
  # NO credential: neither the fleet nor the Vendor API has one. It also
  # needs the database (always required) because its identifier maps and
  # submission ledger live in Postgres (migration 0006). Any value other than
  # stub or live is refused at render, because the binary would read it as stub.
  # (ADR 0009 §4 removed the earlier sandbox tier: the network has no separate
  # sandbox environment of its own to target.)
  networkMode: "stub"

  # NETWORK_BASE_URL, the Vendor API's base URL (ADR 0026). Only read when
  # config.networkMode is "live"; rendered only then. No default: a live
  # deployment must name its own target explicitly.
  networkBaseUrl: ""

  # NETWORK_VENDOR_ID, the vendor account the service acts as (ADR 0026). The
  # account must already exist on the network; this service never creates it.
  # Only read when config.networkMode is "live"; rendered only then. No default.
  networkVendorId: ""

  # INBOUND_RECEIVING_URL and PRODUCT_MASTER_URL, the REST base URLs of the two
  # fleet contexts the inbound loop calls (ADR 0028): it registers an ASN for
  # each seller shipment and resolves each GTIN to a SKU. Only read when
  # config.networkMode is "live"; rendered only then; the chart and the binary
  # both refuse live without them. No default: a deployment names its own.
  inboundReceivingUrl: ""
  productMasterUrl: ""

  # INBOUND_INTAKE_INTERVAL: how often the inbound loop polls shipments and
  # retries the ones that could not be registered yet (ADR 0028). Live only.
  inboundIntakeInterval: "30s"

  # INBOUND_RECEIPT_CONSUMER_GROUP: this service's consumer group on
  # inbound-receiving's events topic, through which closed receipts (cartons and
  # discrepancies included) come back to be reported to the network (ADR 0028).
  # Durable and unique to this service. Live only; the chart and the binary both
  # refuse live without it. No default: warehouse-infra names it.
  inboundReceiptConsumerGroup: ""

  # order-management's in-cluster REST base URL. The one upstream this
  # context calls; the default matches the fleet's service naming.
  orderManagementUrl: "http://order-management.warehouse.svc.cluster.local"

  # How often the acknowledgement-deadline sweep runs. Every unanswered
  # order past its 24h window is sitting on real inventory reservations,
  # so this decides how long the floor stays blocked by demand the
  # network never confirmed.
  sweepInterval: "5m"

  # Browser origins allowed to call this read-only API directly
  # (internal/adapters/inbound/http/server.go's corsMiddleware).
  # 5173 is warehouse-console's own dev port, always included; 5188 is
  # this context's own netfulfil_mfe remote dev port (web/vite.config.ts).
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5188"

# There is no credentials block: the live adapter (ADR 0026) authenticates with
# nothing, and the only Secret this chart renders or references is the
# database one below. NETWORK_CLIENT_ID, NETWORK_CLIENT_SECRET and
# NETWORK_REFRESH_TOKEN were mounted for an adapter that never existed and no
# code reads them; a values file that still sets credentials.* has those keys
# ignored.

# The Anti-Corruption Layer's dictionary: the network's product identifier
# to our SKU, rendered into a ConfigMap and mounted as a file.
#
# EMPTY BY DEFAULT, AND THAT IS NOT HARMLESS. With no mappings every order
# the network sends is rejected as untranslatable: the pod is healthy, the
# poller works, and the answer is always no. The service logs a WARNING at
# startup when this is empty, because the symptom on its own looks exactly
# like a network asking only for products we do not stock.
#
# There is deliberately no default mapping. This is curated business data —
# nobody can derive which of our SKUs an external identifier means, and a
# plausible-looking fake would be worse than an empty dictionary.
productTranslation:
  mappings: []
  # - networkProductId: ASIN-XYZ123
  #   sku: sku-1

# The node definitions the live adapter registers on the network for any site
# that is not yet one of its nodes (ADR 0026 Decision 7), rendered into the data
# ConfigMap as nodes.json and read from NETWORK_NODES_FILE.
#
# Used ONLY when config.networkMode is "live"; ignored in stub mode. OPTIONAL: a
# site whose vendorNodeCode is already a node on the network is adopted without
# a definition. A site with neither is logged at every poll and gets no demand.
# The keys are the file's strict schema (the chart refuses a typo or a missing
# required key): siteCode, nodeType, regionId, timezone, postalCode and
# countryCode are required; subtype is optional; lat and lon are optional and go
# together. The values are the network's to judge. The service reads the file
# once, at boot: change it, then roll the pod.
networkNodes:
  nodes: []
  # - siteCode: site-1
  #   nodeType: FULFILLMENT_CENTER
  #   subtype: SORTABLE
  #   regionId: SP
  #   timezone: America/Sao_Paulo
  #   postalCode: 01000-000
  #   countryCode: BR
  #   lat: -23.55
  #   lon: -46.63

# Declarative demand for a STUB run: the same pattern as this fleet's
# PATH_CATALOGUE_FILE, and the reason this context needs no write endpoint.
#
# requiredShipBy accepts an RFC 3339 instant or a duration relative to now
# ("+36h"). Prefer the relative form: a fixed instant goes stale and every
# order becomes instantly infeasible, which reads like a promise bug rather
# than an expired fixture.
#
# For config.networkMode "stub" only. The binary REFUSES to boot if a seed
# file is set against the live gateway, because seeded demand would never be
# delivered and somebody would be waiting for it, so the chart refuses to
# render live mode with demands set.
stubDemand:
  demands: []
  # - networkRef: po-4711
  #   siteId: site-1
  #   requiredShipBy: "+36h"
  #   lines:
  #     - networkLineRef: "1"
  #       networkProductId: ASIN-XYZ123
  #       quantity: 3

# Persistence. REQUIRED: set database.url or database.existingSecret. The
# binaries (cmd/netfulfil, cmd/mcp) exit at boot without DATABASE_URL, there is
# no in-memory repository, and the chart refuses to render without a source.
# A real Postgres is the only runtime: the acknowledgement deadlines this
# context owes the network must survive the restart every rollout causes.
#
# Prefer existingSecret outside a throwaway cluster: an inline url lands in
# the release's stored manifest in plain text.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/netfulfil/main.go's wireOrders, cmd/mcp/main.go's buildOrders)
  # -- never for the runtime pgxpool, which always uses
  # existingSecretKey/DATABASE_URL above, unchanged. `optional: true` below
  # so a secret that predates this key (local dev, an environment whose
  # Terraform hasn't been rolled yet) still starts the pod: the Go
  # binary's own MIGRATIONS_DATABASE_URL -> DATABASE_URL fallback then
  # makes migrations run against DATABASE_URL, exactly as before this key
  # existed. See docs/adr/0007-migrations-direct-postgres-connection.md
  # (mirrors order-management's ADR-0029) for the PgBouncer/
  # pg_advisory_lock incompatibility this key exists to route migrations
  # around.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a
# Collector; the service never exposes a Prometheus scrape endpoint of
# its own. An unreachable endpoint is not fatal -- the exporters dial
# lazily, so the pod still starts and serves, it just drops telemetry.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "network-fulfillment"

extraEnv: []

# Gates liveness and readiness until the process is actually serving.
#
# Without it, BOOT WORK RACES THE LIVENESS PROBE and loses: this service
# runs migrations before it starts listening, and in this cluster every
# injected pod's first outbound dial is reset ~10s after start (Istio
# native sidecars), so the first migration attempt fails and the retry
# pushes first-listen past the liveness threshold. Observed live as
# CrashLoopBackOff with exit code 143 — SIGTERM, the kubelet killing a pod
# that was still booting, which reads like an app crash and is not one.
#
# 30 x 2s = 60s of grace, comfortably past the retry budget in
# cmd/netfulfil/main.go, after which liveness takes over unchanged. A
# genuinely broken database still fails the pod; it just is not mistaken
# for a slow one.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# The netfulfil_mfe Module Federation remote: a static SPA bundle served by
# its own nginx pod, reached through warehouse-infra's Nginx web gateway at
# /mfes/network-fulfillment/. Deliberately a SEPARATE workload from the OLTP
# API above -- Kong never routes to it, and the OLTP Service must never
# select it (see the distinct app.kubernetes.io/component labels on both
# Deployments/Services in this chart).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/network-fulfillment-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# Kafka is REQUIRED: KAFKA_BROKERS is always set on the api Deployment and the
# projector, and the chart refuses to render with brokers empty. This service
# PUBLISHES onto warehouse.network-fulfillment.events (and, in the same fan-out,
# warehouse.network-fulfillment.analytics) through the transactional outbox and
# its relay (always on), and consumes the capability-offer topics for its
# path-capability and capacity caches (always on; CAPABILITY_OFFER_ENABLED, if
# set in extraEnv, must be "true"). /readyz checks Postgres and Kafka broker
# metadata. There is no localhost default: set brokers explicitly.
#
# kafka.enabled is no longer a switch. Leave it out; the legacy
# `enabled: true` that warehouse-infra still sets is tolerated, `false` is
# refused at render.
kafka:
  brokers: ""   # REQUIRED, comma-separated host:port list (KAFKA_BROKERS)

# --- analytics data product (ADR 0002) ---
# The "Network Order Acknowledgement & Translation" report: a separate
# analytics topic, a writer (netfulfil-projector) and a read-only reader
# (netfulfil-reports), backed by a separate analytical database. Disabled
# by default so existing releases are unaffected; set analytics.enabled=true
# to deploy the two extra processes. While enabled the chart requires
# analytics.database.url or analytics.database.existingSecret
# (ANALYTICS_DATABASE_URL); the projector reads kafka.brokers above.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # cmd/netfulfil-projector and cmd/netfulfil-reports both read
    # ANALYTICS_DATABASE_URL directly (see their main.go) -- unlike some
    # siblings, this binary pair has no separate reader-role env var today,
    # so there is deliberately one URL here, not a projector/reports pair.
    url: ""
    # Name of an existing Secret with an ANALYTICS_DATABASE_URL key. Takes
    # precedence over url above.
    existingSecret: ""
  projector:
    replicaCount: 1
    # cmd/netfulfil-projector's own default ADMIN_ADDR (no port is exposed
    # to a Service -- it is a pure consumer -- but the admin server still
    # needs an address for its /healthz probe).
    adminAddr: ":8091"
    # Deliberately NOT HPA-scalable (no autoscaling.projector block
    # exists in this chart, unlike order-management's identically-named
    # component). Its Kafka consumer group id is minted FRESH per
    # process instance (internal/adapters/inbound/kafka's
    # NewUniqueConsumerGroup(AnalyticsConsumerGroupPrefix)) rather than a
    # single stable shared group -- the opposite convention from
    # order-management's AnalyticsConsumerGroup. Running N>1 replicas
    # would each join with their OWN unique group and each independently
    # replay the ENTIRE analytics topic from kafkago.FirstOffset,
    # double/triple-projecting every historical event rather than
    # sharing partitions the way a stable shared group would. Fixing
    # this to be safely scalable would mean switching to a stable shared
    # group name (a real behavior change to the replay-on-restart
    # semantics), out of scope for this chart-and-pgxpool-tuning PR.
    # replicaCount therefore stays a plain, manually-set value.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    # cmd/netfulfil-reports' own default HTTP_ADDR. NOTE this repo's reports
    # binary defaults to :8092, matching its siblings' convention, but this
    # value is read from the binary's actual source rather than assumed.
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Kong exposure of the reports API (reports-route.yaml): host path
    # /api/<context>/reports rewritten to /reports. Off by default;
    # warehouse-infra turns it on with the real parentRefs and path.
    route:
      enabled: false
      path: "/api/network-fulfillment/reports"
      parentRefs:
        - name: ""
          namespace: ""
          sectionName: "http"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR 0002) ---
# The Model Context Protocol server (cmd/mcp): a second deployable over the
# same read use cases and OLTP database as the HTTP service, served over
# Streamable HTTP at "/" and "/mcp" with a GET /healthz for the probes.
# Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart, mirroring order-management's identical exclusion): the
# github.com/modelcontextprotocol/go-sdk StreamableHTTPHandler this
# adapter wraps (internal/adapters/inbound/mcp/server.go's Handler)
# keeps per-process, in-memory session state keyed by the MCP protocol's
# own Mcp-Session-Id header -- a real multi-request session, not just a
# TCP/HTTP connection. charts/network-fulfillment/templates/
# mcp-service.yaml is a plain ClusterIP Service with no sessionAffinity
# configured, so under >1 replica a second request carrying the same
# Mcp-Session-Id (e.g. a tools/call following an earlier initialize)
# could land on a different pod than the one that created the session,
# which has never heard of it and would reject or silently start a new
# one. Fixing it for real needs either sessionAffinity: ClientIP (a
# partial mitigation only) or wiring the SDK's own external/shared
# session store -- a real code change, out of scope for this
# chart-and-pool-tuning PR. mcp.replicaCount stays a plain, manually-set
# value.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/mcp/<context> rewritten to /mcp. Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/mcp/network-fulfillment"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  # Overrides the reports base URL the get_acknowledgement_report tool
  # calls. When empty and analytics.enabled=true, defaults to the
  # in-cluster reports Service.
  reportsBaseUrl: ""
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
