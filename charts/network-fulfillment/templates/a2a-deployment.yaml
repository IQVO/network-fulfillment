{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-fulfillment.a2aFullname" . }}
  labels:
    {{- include "network-fulfillment.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "network-fulfillment.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "network-fulfillment.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "network-fulfillment.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # The Agent Card must advertise a URL agent clients can dial
            # (ADR 0030): default to this release's in-cluster Service DNS.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%d/" (include "network-fulfillment.a2aFullname" .) .Release.Namespace (int .Values.a2a.service.port)) | quote }}
            # cmd/a2a runs the OLTP migrations on start (idempotent) before
            # opening the same read repositories cmd/netfulfil serves off of.
            # It is READ-ONLY (ADR 0030): no KAFKA_BROKERS / EVENT_PUBLISHER,
            # because no publisher, outbox or relay runs in this process.
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            # DATABASE_URL is always set and required: cmd/a2a exits at boot
            # without it (the render fails without a database source).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "network-fulfillment.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and docs/adr/0007-migrations-direct-postgres-connection.md:
            # cmd/a2a also runs migrations on start (see the comment
            # above), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "network-fulfillment.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "network-fulfillment-a2a"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
