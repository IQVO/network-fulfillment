apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-fulfillment.fullname" . }}
  labels:
    {{- include "network-fulfillment.labels" . | nindent 4 }}
data:
  # This context's configuration surface (see cmd/netfulfil/main.go).
  PORT: {{ .Values.config.port | quote }}

  # NETWORK_MODE decides which external-network adapter is wired:
  #   stub    - no external calls, no credentials (the default)
  #   sandbox - the network's sandbox endpoint, sandbox credentials
  #   live    - the real network, real credentials
  # The binary FAILS CLOSED: an unrecognised value falls back to stub, and
  # live/sandbox REFUSE TO BOOT without credentials rather than silently
  # degrading. That refusal is the point -- a context that quietly stopped
  # talking to the network would look healthy while acknowledging nothing.
  NETWORK_MODE: {{ .Values.config.networkMode | quote }}

  # order-management's REST base URL. This is the one upstream this
  # context calls, and it is a genuine dependency rather than optional
  # plumbing: without it no held order can be raised and no feasibility
  # verdict can be asked for (ADR 0001 section 7).
  ORDER_MANAGEMENT_URL: {{ .Values.config.orderManagementUrl | quote }}

  # How often the acknowledgement-deadline sweep runs. Every unanswered
  # order past its window holds real inventory reservations, so this is
  # the knob deciding how long the floor can be blocked by demand the
  # network never confirmed.
  SWEEP_INTERVAL: {{ .Values.config.sweepInterval | quote }}

  # How often the network is polled for new demand. Inbound is a poll and
  # nothing else (ADR 0001 section 5): the network offers no push, so this
  # interval is the ONLY thing that brings demand into this context. It
  # must stay far below the 24h acknowledgement window -- a poller that is
  # down or slow spends someone else's deadline, and an outage here is an
  # SLA breach rather than a delayed batch.
  POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}

  # Browser origins allowed to call this read-only API directly (this
  # context's own netfulfil_mfe remote dev port plus warehouse-console's).
  # See internal/adapters/inbound/http/server.go's corsMiddleware.
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
{{- if .Values.productTranslation.mappings }}

  # The Anti-Corruption Layer's dictionary: the network's product
  # identifier to our SKU. Without it EVERY order is rejected as
  # untranslatable -- the service looks healthy, answers the network in the
  # negative every time, and the cause is invisible because refusing
  # unknown products is also correct behaviour. Mounted as a file because
  # it is curated data, not configuration: nobody can derive this mapping.
  PRODUCT_TRANSLATION_FILE: /etc/network-fulfillment/products.json
{{- end }}
{{- if .Values.stubDemand.demands }}

  # Declarative demand for a stub run, the same shape as this fleet's
  # PATH_CATALOGUE_FILE. This is how a credential-free deployment is given
  # something to receive; the honest alternative to a write endpoint that
  # exists only for testing and has no production counterpart.
  NETWORK_SEED_FILE: /etc/network-fulfillment/demand.json
{{- end }}
