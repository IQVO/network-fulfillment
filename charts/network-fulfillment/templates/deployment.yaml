{{- include "network-fulfillment.requireRealRuntime" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-fulfillment.fullname" . }}
  labels:
    {{- include "network-fulfillment.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "network-fulfillment.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "network-fulfillment.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "network-fulfillment.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # A single containerPort: this context serves only inbound
            # HTTP (/healthz plus the network-demand intake routes) off
            # one http.Server on PORT -- see cmd/netfulfil/main.go.
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # envFrom mounts every ConfigMap key at once; the explicit env
          # entries below for the same names take precedence (standard
          # Kubernetes merge behaviour), so they are belt-and-braces for
          # the values that must never silently arrive empty.
          envFrom:
            - configMapRef:
                name: {{ include "network-fulfillment.fullname" . }}
          env:
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: NETWORK_MODE
              value: {{ .Values.config.networkMode | quote }}
            - name: ORDER_MANAGEMENT_URL
              value: {{ .Values.config.orderManagementUrl | quote }}
            - name: SWEEP_INTERVAL
              value: {{ .Values.config.sweepInterval | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            # KAFKA_BROKERS is always set and required: Postgres and Kafka are
            # the only runtime, so the render fails when kafka.brokers is
            # empty. extraEnv wins: warehouse-infra also names KAFKA_BROKERS
            # there and a duplicate env entry breaks ArgoCD's diff, so the
            # chart value is rendered only when extraEnv does not name it.
            {{- $extra := dict }}
            {{- range .Values.extraEnv }}
            {{- $_ := set $extra .name true }}
            {{- end }}
            {{- if not (hasKey $extra "KAFKA_BROKERS") }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- end }}
            # DATABASE_URL is always set and required (the render fails
            # without database.url or database.existingSecret).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "network-fulfillment.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and docs/adr/0007-migrations-direct-postgres-connection.md: a
            # direct (non-pooled) connection used only for the migration
            # step in cmd/netfulfil/main.go's wireOrders, never for the
            # runtime pgxpool. `optional: true` so a secret without this
            # key yet (predates this chart version) still starts the pod
            # -- the binary falls back to DATABASE_URL itself when this
            # env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "network-fulfillment.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- if include "network-fulfillment.hasDataFiles" . }}
          volumeMounts:
            - name: data
              mountPath: /etc/network-fulfillment
              readOnly: true
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if include "network-fulfillment.hasDataFiles" . }}
      volumes:
        - name: data
          configMap:
            name: {{ include "network-fulfillment.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
