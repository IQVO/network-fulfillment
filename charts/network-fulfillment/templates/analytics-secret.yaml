{{- if and .Values.analytics.enabled (not .Values.analytics.database.existingSecret) }}
{{- if .Values.analytics.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "network-fulfillment.analyticsSecretName" . }}
  labels:
    {{- include "network-fulfillment.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Both netfulfil-projector (read-write) and netfulfil-reports (read) read
  # this same ANALYTICS_DATABASE_URL key directly -- see their main.go.
  # Unlike some siblings' charts, there is deliberately no separate
  # reader-role DSN here: the two binaries share one env var name today.
  ANALYTICS_DATABASE_URL: {{ .Values.analytics.database.url | quote }}
{{- end }}
{{- end }}
